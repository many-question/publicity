# Publish the repository with GitHub Pages. Every published item (a folder <section>/<name>/ with an
# index.html, e.g. talk/261201-topic/) is also zipped into an offline package next to its page
# (<section>/<name>/<name>.zip), which the page offers for download.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Zip each item as an offline package
        run: |
          for d in */*/; do
            d="${d%/}"
            [ -f "$d/index.html" ] || continue
            section="${d%%/*}"; name="${d#*/}"
            (cd "$section" && zip -qr "$name/$name.zip" "$name" -x "$name/$name.zip")
            ls -l "$d/$name.zip"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
